<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Following Robot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #1F4788;
            margin-top: 0;
        }
        
        canvas {
            border: 3px solid #333;
            display: block;
            margin: 20px auto;
            background: white;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 30px;
            font-size: 16px;
            margin: 10px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #E64A19;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Line-Following Robot Simulator</h1>
        <canvas id="canvas" width="800" height="500"></canvas>
        
        <div class="controls">
            <button onclick="toggleSimulation()">START</button>
            <button onclick="resetSimulation()">RESET</button>
            <button onclick="setupTrack('straight')">STRAIGHT</button>
            <button onclick="setupTrack('curves')">CURVES</button>
            <button onclick="setupTrack('zigzag')">ZIGZAG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let progress = 0;
        let isRunning = false;
        let currentTrack = 'straight';
        
        const paths = {
            straight: function(y_percent) {
                return {
                    x: canvas.width / 2,
                    y: y_percent * canvas.height
                };
            },
            curves: function(y_percent) {
                const y = y_percent * canvas.height;
                const x = canvas.width / 2 + Math.sin(y_percent * Math.PI * 3) * 100;
                return { x, y };
            },
            zigzag: function(y_percent) {
                let x, y;
                
                // Segment 1: Top center to left (0 to 1/3)
                if (y_percent < 0.33) {
                    const t = y_percent / 0.33;
                    x = canvas.width / 2 + (t - 1) * (canvas.width * 0.25);
                    y = t * (canvas.height / 3);
                }
                // Segment 2: Left to right (1/3 to 2/3)
                else if (y_percent < 0.66) {
                    const t = (y_percent - 0.33) / 0.33;
                    x = canvas.width * 0.25 + t * (canvas.width * 0.5);
                    y = (canvas.height / 3) + t * (canvas.height / 3);
                }
                // Segment 3: Right to left (2/3 to 1)
                else {
                    const t = (y_percent - 0.66) / 0.34;
                    x = canvas.width * 0.75 - t * (canvas.width * 0.5);
                    y = (canvas.height * 2 / 3) + t * (canvas.height / 3);
                }
                
                return { x, y };
            }
        };
        
        function drawBlackLine() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 50;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            const pathFunc = paths[currentTrack];
            const startPos = pathFunc(0);
            ctx.moveTo(startPos.x, startPos.y);
            
            for (let i = 0; i <= 1; i += 0.01) {
                const pos = pathFunc(i);
                ctx.lineTo(pos.x, pos.y);
            }
            
            ctx.stroke();
        }
        
        function drawDot() {
            const pathFunc = paths[currentTrack];
            const pos = pathFunc(progress);
            
            ctx.fillStyle = '#FF6B35';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function animate() {
            drawBlackLine();
            drawDot();
            
            if (isRunning) {
                progress += 0.002;
                if (progress > 1) {
                    progress = 0;
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        function toggleSimulation() {
            isRunning = !isRunning;
        }
        
        function resetSimulation() {
            isRunning = false;
            progress = 0;
        }
        
        function setupTrack(trackName) {
            currentTrack = trackName;
            resetSimulation();
        }
        
        animate();
    </script>
</body>
</html>
