<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Following Robot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #1F4788;
            margin-top: 0;
        }
        
        canvas {
            border: 3px solid #333;
            display: block;
            margin: 20px auto;
            background: white;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 30px;
            font-size: 16px;
            margin: 10px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #E64A19;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Line-Following Robot Simulator</h1>
        <canvas id="canvas" width="800" height="500"></canvas>
        
        <div class="controls">
            <button onclick="toggleSimulation()">START</button>
            <button onclick="resetSimulation()">RESET</button>
            <button onclick="changeTrack(0)">STRAIGHT</button>
            <button onclick="changeTrack(1)">CURVES</button>
            <button onclick="changeTrack(2)">ZIGZAG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let dotPosition = 0;
        let isRunning = false;
        let trackType = 0;
        
        const tracks = {
            straight: function(t) {
                return {
                    x: canvas.width / 2,
                    y: t * canvas.height
                };
            },
            curves: function(t) {
                const y = t * canvas.height;
                const x = canvas.width / 2 + Math.sin(t * Math.PI * 4) * 150;
                return { x, y };
            },
            zigzag: function(t) {
                const y = t * canvas.height;
                let x;
                if (t < 0.33) {
                    x = canvas.width / 2 + (t / 0.33 - 1) * canvas.width * 0.25;
                } else if (t < 0.66) {
                    x = canvas.width / 2 - canvas.width * 0.25 + ((t - 0.33) / 0.33) * canvas.width * 0.5;
                } else {
                    x = canvas.width / 2 + canvas.width * 0.25 - ((t - 0.66) / 0.34) * canvas.width * 0.25;
                }
                return { x, y };
            }
        };
        
        function drawLine() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 50;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            
            let trackFunc = trackType === 0 ? tracks.straight : 
                           trackType === 1 ? tracks.curves : 
                           tracks.zigzag;
            
            const pos = trackFunc(0);
            ctx.moveTo(pos.x, pos.y);
            
            for (let t = 0; t <= 1; t += 0.01) {
                const pos = trackFunc(t);
                ctx.lineTo(pos.x, pos.y);
            }
            
            ctx.stroke();
        }
        
        function drawDot() {
            let trackFunc = trackType === 0 ? tracks.straight : 
                           trackType === 1 ? tracks.curves : 
                           tracks.zigzag;
            
            const pos = trackFunc(dotPosition);
            
            ctx.fillStyle = '#FF6B35';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function animate() {
            drawLine();
            drawDot();
            
            if (isRunning) {
                dotPosition += 0.003;
                if (dotPosition > 1) {
                    dotPosition = 0;
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        function toggleSimulation() {
            isRunning = !isRunning;
        }
        
        function resetSimulation() {
            isRunning = false;
            dotPosition = 0;
        }
        
        function changeTrack(type) {
            trackType = type;
            resetSimulation();
        }
        
        animate();
    </script>
</body>
</html>
